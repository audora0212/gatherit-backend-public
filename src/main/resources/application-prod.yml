# 외부 DB와 저장소를 연결할 때 필요한 환경 설정 예시.
spring:
  web:
    error:
      # 오류 응답에 내부 정보를 포함하지 않는다.
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
  datasource:
    url: ${DB_JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 풀 크기와 유휴 연결 수명은 환경에 맞춰 spring.datasource.hikari.*로 조정한다.
    # max-lifetime은 DB와 네트워크의 유휴 연결 제한을 고려해 정한다.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000               # 1h
  refresh-expiration: 31536000000   # 365d

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION}
    # 키를 지정하지 않으면 AWS SDK 기본 자격 증명 체인을 사용한다.

gatherit:
  storage:
    type: s3
  photo:
    expiry-days: 7
    expiry-batch-size: 200

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}

# APNs (Apple Push Notification service) — Expo Push Service 우회용 직접 호출.
# key-path 비워두면 disabled 모드 (push silent skip) 라 키 도착 전에도 BE 정상 부팅.
apns:
  key-path: ${APNS_KEY_PATH:}
  key-id: ${APNS_KEY_ID:}
  team-id: ${APNS_TEAM_ID:}
  topic: ${APNS_TOPIC:}
  production: ${APNS_PRODUCTION:false}

# FCM (Firebase Cloud Messaging) HTTP v1 — Android 네이티브 푸시 직접 호출.
# credentials-path 비워두면 disabled 모드 (Android push silent skip) 라 키 도착 전에도 정상 부팅.
fcm:
  project-id: ${FCM_PROJECT_ID:}
  credentials-path: ${FCM_CREDENTIALS_PATH:}

logging:
  level:
    root: INFO
    com.gatherit: INFO
    org.hibernate.SQL: WARN
