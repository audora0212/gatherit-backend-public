# Docker Compose 로컬 데모 프로필. 운영 프로필과 별개입니다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:gatherit}?sslMode=REQUIRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:gatherit}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update          # 빈 데모 DB에 스키마 자동 생성

jwt:
  secret: ${JWT_SECRET}

gatherit:
  public-web-base-url: http://127.0.0.1:3000
  photo:
    local-dir: /tmp/gatherit-demo-uploads
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
