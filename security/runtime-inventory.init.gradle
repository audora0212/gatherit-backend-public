import groovy.json.JsonOutput

// Resolve coordinates without changing the application build or dependency versions.
// bootJar may inject Spring Boot's own jarmode tools outside runtimeClasspath.
gradle.projectsEvaluated {
    def app = gradle.rootProject
    app.tasks.register('securityRuntimeInventory') {
        group = 'verification'
        description = 'Export resolved runtime coordinates for packaged-JAR vulnerability checks.'
        doLast {
            // Do not accidentally send future private/local package names to OSV.
            // This build currently resolves public runtime libraries only from Central.
            def central = ['https://repo.maven.apache.org/maven2', 'https://repo1.maven.org/maven2']
            if (app.repositories.any { repo ->
                !(repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) ||
                        !(repo.url.toString().replaceAll('/+$', '') in central)
            }) {
                throw new GradleException('Review non-Central runtime repositories before an external vulnerability lookup')
            }
            def artifacts = app.configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { a ->
                if (!(a.id.componentIdentifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)) {
                    throw new GradleException('Review local/project runtime artifacts before an external vulnerability lookup')
                }
                [file: a.file.name, group: a.moduleVersion.id.group,
                 name: a.moduleVersion.id.name, version: a.moduleVersion.id.version]
            }
            def bootPlugin = app.plugins.findPlugin('org.springframework.boot')
            if (bootPlugin == null) {
                throw new GradleException('Spring Boot plugin is required for the artifact inventory')
            }
            def bootVersion = bootPlugin.class.package.implementationVersion
            if (!bootVersion) {
                throw new GradleException('Cannot identify the Spring Boot plugin version')
            }
            artifacts.add([file: "spring-boot-jarmode-tools-${bootVersion}.jar".toString(),
                           group: 'org.springframework.boot', name: 'spring-boot-jarmode-tools',
                           version: bootVersion])
            def destination = app.layout.buildDirectory.file('security/resolved-runtime.json').get().asFile
            destination.parentFile.mkdirs()
            destination.setText(JsonOutput.prettyPrint(JsonOutput.toJson([artifacts: artifacts.sort { it.file }])), 'UTF-8')
            logger.lifecycle('Resolved runtime inventory written to build/security/resolved-runtime.json')
        }
    }
}
