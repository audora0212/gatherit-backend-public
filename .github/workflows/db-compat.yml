name: Database upgrade compatibility

on:
  push:
    branches: [main]
    paths:
      - 'deploy/db-compat/**'
      - '.github/workflows/db-compat.yml'
      - 'build.gradle'
      - 'src/main/java/**'
      - 'src/main/resources/application*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/db-compat/**'
      - '.github/workflows/db-compat.yml'
      - 'build.gradle'
      - 'src/main/java/**'
      - 'src/main/resources/application*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: MySQL 8.4 / JDK ${{ matrix.java }} / ${{ matrix.timezone }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '17'
            timezone: UTC
          - java: '21'
            timezone: Asia/Seoul
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Java 17 compile toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Select compatibility test JVM
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile application classes without starting the service
        run: |
          chmod +x gradlew
          ./gradlew classes --no-daemon
      - name: Verify old and new runtimes against the isolated schema fixture
        env:
          GATHERIT_RUN_DB_COMPAT: 'true'
          DB_COMPAT_EXPECT_JAVA: ${{ matrix.java }}
          DB_COMPAT_JVM_TIMEZONE: ${{ matrix.timezone }}
        run: ./gradlew -p deploy/db-compat runCompatibility --no-daemon
      - name: Retain only non-sensitive compatibility summaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: db-compat-jdk-${{ matrix.java }}
          path: |
            deploy/db-compat/build/reports/compatibility.json
            deploy/db-compat/build/reports/phases/*.json
          if-no-files-found: error
          retention-days: 14
